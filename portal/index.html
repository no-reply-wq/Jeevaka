<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeevaka ERP</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }

    /* ── LAYOUT ─────────────────────────────────────────────────────────────── */
    #shell {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 48px 1fr;
      height: 100vh;
      width: 100vw;
    }

    /* ── TOP HEADER ─────────────────────────────────────────────────────────── */
    #top-header {
      grid-column: 1 / -1;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px 0 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      z-index: 10;
    }
    #top-logo {
      width: auto; height: 100%; padding-right: 20px;
      background: linear-gradient(180deg, #022c2e 0%, #0D7377 100%);
      display: flex; align-items: center; gap: 9px;
      padding: 0 14px;
      font-size: 13px; font-weight: 700; color: #fff; letter-spacing: .3px;
      flex-shrink: 0;
    }
    #top-right {
      display: flex; align-items: center; gap: 18px;
      font-size: 12.5px; color: #4b5563;
    }
    #top-user {
      display: flex; align-items: center; gap: 6px;
      background: #f0f4f4; border-radius: 6px; padding: 5px 11px;
      cursor: pointer; font-size: 12.5px; font-weight: 600; color: #0D7377;
      position: relative;
    }
    #top-user:hover { background: #e8f5f5; }
    #user-dropdown {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12); min-width: 160px; z-index: 100;
      overflow: hidden;
    }
    #user-dropdown.open { display: block; }
    .ud-item {
      padding: 10px 14px; font-size: 12.5px; color: #374151; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
    }
    .ud-item:hover { background: #f9fafb; }
    .ud-item.danger { color: #dc2626; }
    .ud-item.danger:hover { background: #fef2f2; }

    /* ── SIDEBAR ─────────────────────────────────────────────────────────────── */
    #sidebar {
      display: none;
    }
    .sb-section { padding: 4px 0; }
    .sb-title {
      padding: 10px 14px 4px; font-size: 9.5px; font-weight: 700;
      color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing: 1px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; margin: 1px 8px; font-size: 13px;
      color: rgba(255,255,255,.65); cursor: pointer;
      border-radius: 8px; border-left: none;
      transition: background .12s, color .12s; position: relative;
      user-select: none;
    }
    .nav-item:hover { background: rgba(255,255,255,.1); color: #fff; }
    .nav-item.active { background: rgba(255,255,255,.18); color: #fff; font-weight: 600; }
    .nav-item.active::before {
      content:''; position:absolute; left:-8px; top:50%; transform:translateY(-50%);
      width:3px; height:18px; background:#fff; border-radius:0 3px 3px 0;
    }
    .nav-icon { width:16px; height:16px; flex-shrink:0; }
    #sb-footer {
      margin-top: auto; padding: 12px 10px;
      border-top: 1px solid rgba(255,255,255,.1);
    }
    #sb-user-info {
      font-size: 12px; color: rgba(255,255,255,.55); margin-bottom: 10px; padding: 0 4px; line-height: 1.5;
    }
    #sb-user-info b { color: rgba(255,255,255,.85); }
    #btn-logout {
      width:100%; padding:8px; border-radius:8px;
      background:rgba(255,80,80,.12); color:rgba(255,170,170,.85);
      border:1px solid rgba(255,100,100,.2); font-size:12.5px; font-weight:600;
      cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:6px;
    }
    #btn-logout:hover { background:rgba(255,80,80,.22); color:#fca5a5; }
    #sb-powered {
      font-size:10.5px; color:rgba(255,255,255,.3); text-align:center;
      padding:6px 0 2px; border-top:1px solid rgba(255,255,255,.08); margin-top:8px;
    }
    #sb-powered a { color:rgba(255,255,255,.5); text-decoration:none; font-weight:600; }
    #admin-section { display:none; }

    /* ── CONTENT IFRAME ──────────────────────────────────────────────────────── */
    #content-wrap {
      grid-row: 2; position: relative; overflow: hidden;
      background: #f0f4f4;
    }
    #erp-frame {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: none; display: block;
    }

    /* ── LOADING OVERLAY ────────────────────────────────────────────────────── */
    #loading-overlay {
      position: absolute; inset: 0; z-index: 5;
      background: #f0f4f4;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
    }
    #loading-overlay.hidden { display: none; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #d1e8e8;
      border-top-color: #0D7377;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: #6b7280; font-weight: 500; }

    /* ── LOGIN SCREEN ────────────────────────────────────────────────────────── */
    #login-screen {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: linear-gradient(135deg, #022c2e 0%, #0D7377 60%, #14a085 100%);
      align-items: center; justify-content: center;
    }
    #login-screen.visible { display: flex; }
    .login-card {
      background: #fff; border-radius: 18px;
      padding: 40px 36px 36px;
      width: 100%; max-width: 380px;
      box-shadow: 0 24px 60px rgba(0,0,0,.22);
    }
    .login-logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 28px;
    }
    .login-logo-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg,#022c2e,#0D7377);
      display: flex; align-items: center; justify-content: center;
    }
    .login-title { font-size: 17px; font-weight: 700; color: #111827; }
    .login-sub   { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .login-field { margin-bottom: 16px; }
    .login-field label { display:block; font-size:12.5px; font-weight:600; color:#374151; margin-bottom:5px; }
    .login-field input {
      width:100%; padding:10px 12px; border:1.5px solid #d1d5db; border-radius:8px;
      font-size:13.5px; color:#111827; outline:none; transition:border .15s;
    }
    .login-field input:focus { border-color:#0D7377; box-shadow:0 0 0 3px rgba(13,115,119,.1); }
    #login-btn {
      width:100%; padding:11px; border:none; border-radius:9px;
      background: linear-gradient(135deg,#022c2e,#0D7377);
      color:#fff; font-size:14px; font-weight:700; cursor:pointer;
      letter-spacing:.3px; transition:opacity .15s; margin-top:4px;
    }
    #login-btn:hover { opacity:.88; }
    #login-btn:disabled { opacity:.55; cursor:not-allowed; }
    #login-error {
      display:none; margin-top:14px; padding:10px 13px;
      background:#fef2f2; border:1px solid #fca5a5; border-radius:8px;
      color:#dc2626; font-size:12.5px; line-height:1.5;
    }
    #login-error.visible { display:block; }
  </style>
</head>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
// IMPORTANT: Update this URL to match your deployed GAS Web App URL
var GAS_URL  = 'https://script.google.com/macros/s/AKfycbxvXlM6m4ErR-XOkuMRieXj4vwc_8oGDfzV2TP3azJKcid0uyy_lGOWKBrT9zWWSmTsPQ/exec';
var GAS_BASE = GAS_URL + '?clientId=CLI_JVK_1787058819057';

var PAGE_TITLES = {
  dashboard:'Dashboard', indents:'Indent', purchase:'Purchase Order',
  grn:'GRN / Receiving', issue:'Store Issue', stock:'Stock Balance',
  items:'Item Master', admin:'User Management', vendors:'Vendors',
  reports:'Reports'
};

// ── STATE ─────────────────────────────────────────────────────────────────────
var _current = '';
var _token   = '';
var _user    = null;
var frame    = document.getElementById('erp-frame');
var overlay  = document.getElementById('loading-overlay');

// ── PORTAL STORAGE (diiljeeva.in origin — completely separate from GAS) ───────
function pStore(key, val) { try { localStorage.setItem('p_' + key, JSON.stringify(val)); } catch(e){} }
function pRead(key)       { try { return JSON.parse(localStorage.getItem('p_' + key) || 'null'); } catch(e){ return null; } }
function pDel(key)        { try { localStorage.removeItem('p_' + key); } catch(e){} }

// ── GAS FETCH — NO CORS PREFLIGHT ────────────────────────────────────────────
// KEY FIX: Using Content-Type: application/x-www-form-urlencoded (a "simple request").
// Browsers only send a CORS preflight for non-simple content types like application/json.
// GAS does NOT return Access-Control-Allow-Origin headers, so preflight = blocked.
// With form-urlencoded there is NO preflight → browser sends the request directly → works.
// We encode the entire JSON payload as a single field called "payload".
// GAS reads it via: e.parameter.payload (same as any URL/form parameter).
function gasFetch(data, onSuccess, onError) {
  var encoded = 'payload=' + encodeURIComponent(JSON.stringify(data));
  fetch(GAS_URL, {
    method:   'POST',
    headers:  { 'Content-Type': 'application/x-www-form-urlencoded' },
    body:     encoded,
    redirect: 'follow'
  })
  .then(function(res) { return res.json(); })
  .then(onSuccess)
  .catch(onError || function(){});
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function getHashPage() {
  var h = window.location.hash.replace(/^#\/?/, '').toLowerCase().trim();
  return PAGE_TITLES[h] ? h : '';
}
function setActiveNav(page) {
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.page === page);
  });
}
function setTitle(page) {
  document.title = (PAGE_TITLES[page] || 'ERP') + ' | Jeevaka Industries';
}
function applyUser(u) {
  if (!u) return;
  document.getElementById('top-username').textContent = u.full_name || u.email || 'User';
  document.getElementById('sb-username').textContent  = u.full_name || u.email || 'User';
  document.getElementById('sb-role').textContent      = u.designation || (u.role_id || '').replace('ROLE_', '') || '';
  document.getElementById('admin-section').style.display = (u.role_id === 'ROLE_ADMIN') ? 'block' : 'none';
}

// ── NAV ───────────────────────────────────────────────────────────────────────
// Sidebar click → URL updates instantly (same-origin history.pushState),
// then iframe reloads with new page + token passed in URL so GAS skips login.
function navTo(page) {
  if (page === _current) return;
  _current = page;
  history.pushState({ page: page }, '', '/portal/#' + page);
  setTitle(page);
  setActiveNav(page);
  overlay.classList.remove('hidden');
  // Reload iframe with new page — shell reads ?page= from full href
  frame.src = GAS_BASE + '&token=' + encodeURIComponent(_token) + '&page=' + encodeURIComponent(page);
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function doLogin() {
  var email = document.getElementById('li-email').value.trim();
  var pass  = document.getElementById('li-pass').value;
  var btn   = document.getElementById('login-btn');

  document.getElementById('login-error').className = 'login-error';
  if (!email || !pass) { showLoginError('Please enter email and password.'); return; }

  btn.disabled    = true;
  btn.textContent = 'Signing in…';

  gasFetch(
    { action: 'login', email: email, password: pass },
    function(data) {
      btn.disabled    = false;
      btn.textContent = 'Sign In';
      if (data && data.ok && data.token) {
        _token = data.token;
        _user  = data.user;
        pStore('token', _token);
        pStore('user',  _user);
        showShell(null);
      } else {
        showLoginError((data && data.error) || 'Invalid email or password.');
      }
    },
    function() {
      btn.disabled    = false;
      btn.textContent = 'Sign In';
      showLoginError('Network error. Please check your connection and try again.');
    }
  );
}

function showLoginError(msg) {
  var el = document.getElementById('login-error');
  el.textContent = msg;
  el.className   = 'login-error visible';
}

// ── SHELL BOOT ────────────────────────────────────────────────────────────────
function showShell(forcePage) {
  applyUser(_user);
  document.getElementById('login-screen').className  = '';      // hide login
  document.getElementById('shell').style.display     = 'grid';  // show shell

  var startPage = forcePage || getHashPage() || 'dashboard';
  _current = startPage;
  setActiveNav(startPage);
  setTitle(startPage);
  history.replaceState({ page: startPage }, '', '/portal/#' + startPage);

  // Load iframe — token in URL so GAS skips its own login screen
  frame.src = GAS_BASE + '&token=' + encodeURIComponent(_token) + '&page=' + encodeURIComponent(startPage);

  frame.addEventListener('load', function() {
    overlay.classList.add('hidden');
  });
}

function showLoginScreen() {
  document.getElementById('login-screen').className = 'visible';
  document.getElementById('shell').style.display    = 'none';
  document.title = 'Sign In | Jeevaka Industries';
}

// ── SESSION RESUME (on page refresh) ─────────────────────────────────────────
// Reads token from portal's own localStorage (diiljeeva.in origin).
// Shows shell immediately (optimistic), validates in background via gasFetch.
function tryResumeSession() {
  var savedToken = pRead('token');
  var savedUser  = pRead('user');

  if (!savedToken) {
    showLoginScreen();
    return;
  }

  _token = savedToken;
  _user  = savedUser;
  showShell(null); // show immediately — don't make user wait

  // Validate in background — kick to login if expired
  gasFetch(
    { action: 'validate', token: savedToken },
    function(data) {
      if (data && data.valid && data.user) {
        _user = data.user;
        pStore('user', _user);
        applyUser(_user);
      } else {
        pDel('token'); pDel('user');
        doLogout();
      }
    }
    // on network error: keep showing shell (GAS iframe will re-validate on its own)
  );
}

// ── LOGOUT ────────────────────────────────────────────────────────────────────
function doLogout() {
  var tok = _token;
  _token = ''; _user = null; _current = '';
  pDel('token'); pDel('user');
  frame.src = '';
  document.getElementById('admin-section').style.display = 'none';
  document.getElementById('top-username').textContent    = '—';
  document.getElementById('sb-username').textContent     = '—';
  document.getElementById('sb-role').textContent         = '';
  showLoginScreen();
  // Revoke token server-side (fire-and-forget, no CORS preflight needed)
  if (tok) gasFetch({ action: 'logout', token: tok });
}

// ── USER MENU ─────────────────────────────────────────────────────────────────
function toggleUserMenu() {
  document.getElementById('user-dropdown').classList.toggle('open');
}
document.addEventListener('click', function(e) {
  var tu = document.getElementById('top-user');
  if (tu && !tu.contains(e.target)) {
    document.getElementById('user-dropdown').classList.remove('open');
  }
});

// ── BROWSER BACK / FORWARD ────────────────────────────────────────────────────
window.addEventListener('popstate', function(ev) {
  if (!_token) return;
  var page = (ev.state && ev.state.page) || getHashPage() || 'dashboard';
  if (page === _current) return;
  _current = page;
  setActiveNav(page);
  setTitle(page);
  overlay.classList.remove('hidden');
  frame.src = GAS_BASE + '&token=' + encodeURIComponent(_token) + '&page=' + encodeURIComponent(page);
});

// ── ENTER KEY IN LOGIN FORM ───────────────────────────────────────────────────
document.getElementById('li-email').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('li-pass').focus();
});
document.getElementById('li-pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// ── LISTEN FOR NAV EVENTS FROM GAS SHELL ─────────────────────────────────────
// GAS shell sends postMessage({ type: 'ERP_NAV', page }) when user clicks its sidebar
window.addEventListener('message', function(ev) {
  if (!ev.data || ev.data.type !== 'ERP_NAV' || !ev.data.page) return;
  var page = ev.data.page;
  if (page === _current) return;
  _current = page;
  history.pushState({ page: page }, '', '/portal/#' + page);
  setTitle(page);
  setActiveNav(page);
});

// ── BOOT ──────────────────────────────────────────────────────────────────────
tryResumeSession();
</script>

</body>
</html>
