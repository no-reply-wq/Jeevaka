<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeevaka ERP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0D7377; }
    iframe {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
<iframe id="erp-frame" src="" allowfullscreen allow="fullscreen"></iframe>
<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────────
  var GAS_BASE = 'https://script.google.com/macros/s/AKfycbxvXlM6m4ErR-XOkuMRieXj4vwc_8oGDfzV2TP3azJKcid0uyy_lGOWKBrT9zWWSmTsPQ/exec';

  var PAGE_TITLES = {
    dashboard: 'Dashboard',
    indents:   'Indent',
    purchase:  'Purchase Order',
    grn:       'GRN / Receiving',
    issue:     'Store Issue',
    stock:     'Stock Balance',
    items:     'Item Master',
    admin:     'User Management',
    vendors:   'Vendors',
    reports:   'Reports',
    login:     'Login'
  };

  // ── READ PAGE FROM HASH ──────────────────────────────────────────────────────
  // URL looks like: https://diiljeeva.in/portal/#indents
  function getPageFromHash() {
    var hash = window.location.hash.replace(/^#\/?/, '').toLowerCase().trim();
    return PAGE_TITLES[hash] ? hash : '';
  }

  function setTitle(page) {
    document.title = (PAGE_TITLES[page] || 'ERP') + ' | Jeevaka Industries';
  }

  // ── INIT: build iframe src with ?page= ───────────────────────────────────────
  var frame = document.getElementById('erp-frame');
  var _currentPage = getPageFromHash();
  frame.src = GAS_BASE + (_currentPage ? '&page=' + encodeURIComponent(_currentPage) : '');
  setTitle(_currentPage || 'dashboard');

  // ── POLL HASH: ERP shell writes window.parent.location.hash ─────────────────
  // GAS iframes CAN write to parent hash (cross-origin hash writes are allowed).
  // We poll every 300ms to detect changes and update the browser URL cleanly.
  var _lastHash = window.location.hash;
  setInterval(function() {
    var h = window.location.hash;
    if (h !== _lastHash) {
      _lastHash = h;
      var page = getPageFromHash();
      if (page !== _currentPage) {
        _currentPage = page;
        setTitle(page || 'dashboard');
        // Use pushState so browser history works (back/forward)
        history.pushState({ page: page }, '', window.location.pathname + '#' + page);
      }
    }
  }, 300);

  // ── BROWSER BACK / FORWARD ───────────────────────────────────────────────────
  window.addEventListener('popstate', function(e) {
    var page = (e.state && e.state.page) || getPageFromHash() || '';
    _currentPage = page;
    _lastHash = '#' + page;
    setTitle(page || 'dashboard');
    // Reload iframe to the new page (cleanest approach for GAS)
    frame.src = GAS_BASE + (page ? '&page=' + encodeURIComponent(page) : '');
  });
</script>
</body>
</html>
