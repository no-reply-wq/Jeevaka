<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeevaka Industries ERP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f0f2f5; }
    iframe {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<iframe id="erp-frame" src="" allowfullscreen allow="fullscreen"></iframe>

<script>
  // ─── CONFIG ────────────────────────────────────────────────────────────────
  // Your Google Apps Script deployment URL (with clientId already appended)
  var GAS_BASE = 'https://script.google.com/macros/s/AKfycbxvXlM6m4ErR-XOkuMRieXj4vwc_8oGDfzV2TP3azJKcid0uyy_lGOWKBrT9zWWSmTsPQ/exec';

  // Your site's base path — change if you host at /erp/ instead of /
  var SITE_BASE = '/';

  // Pages your ERP knows about (used for URL → page validation)
  var KNOWN_PAGES = [
    'dashboard','indents','purchase','grn','issue','stock',
    'items','admin','vendors','reports','login'
  ];

  // ─── READ PAGE FROM URL PATH ────────────────────────────────────────────────
  // Maps:  https://diiljeeva.in/purchase  →  page = "purchase"
  //        https://diiljeeva.in/          →  page = ""  (ERP picks default)
  //        https://diiljeeva.in/login     →  page = "login"
  function getPageFromPath() {
    var path = window.location.pathname;
    // Strip leading slash and SITE_BASE prefix
    var base = SITE_BASE.replace(/\/$/, '');
    if (path.indexOf(base) === 0) path = path.slice(base.length);
    path = path.replace(/^\//, '').replace(/\/$/, '').toLowerCase();
    return KNOWN_PAGES.indexOf(path) >= 0 ? path : '';
  }

  // ─── BUILD IFRAME SRC ───────────────────────────────────────────────────────
  function buildSrc(page) {
    return GAS_BASE + (page ? '&page=' + encodeURIComponent(page) : '');
  }

  // ─── INIT ───────────────────────────────────────────────────────────────────
  var frame = document.getElementById('erp-frame');
  var _currentPage = getPageFromPath();
  frame.src = buildSrc(_currentPage);

  // Push initial state so history entry exists
  history.replaceState({ page: _currentPage }, '', window.location.href);

  // ─── RECEIVE NAV EVENTS FROM ERP IFRAME ────────────────────────────────────
  // When user clicks a nav item inside the GAS app, it sends:
  //   window.parent.postMessage({ type: 'ERP_NAV', page: 'purchase' }, '*')
  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'ERP_NAV') return;
    var page = e.data.page || '';
    if (page === _currentPage) return; // no duplicate pushes
    _currentPage = page;

    // Update the browser URL bar  (/purchase, /indents, /login …)
    var newPath = SITE_BASE.replace(/\/$/, '') + '/' + (page || '');
    history.pushState({ page: page }, '', newPath || '/');

    // Update tab title
    document.title = page
      ? page.charAt(0).toUpperCase() + page.slice(1) + ' | Jeevaka ERP'
      : 'Jeevaka ERP';
  });

  // ─── HANDLE BROWSER BACK / FORWARD ─────────────────────────────────────────
  window.addEventListener('popstate', function(e) {
    var page = (e.state && e.state.page) || getPageFromPath() || '';
    _currentPage = page;
    // Tell the iframe to navigate there (no full reload)
    frame.contentWindow.postMessage({ type: 'ERP_POPSTATE', page: page }, '*');
    document.title = page
      ? page.charAt(0).toUpperCase() + page.slice(1) + ' | Jeevaka ERP'
      : 'Jeevaka ERP';
  });
</script>

</body>
</html>
