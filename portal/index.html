<!DOCTYPE html>
<html>
<head>
  <title>Jeevaka</title>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxf5UbNS0WGFMFnBC_78p_00pvlrFnZ88Cy0O8VCwDxG7rqcat5AzYppFg8vhYNS8ko/exec?clientId=CLI_JVK_1787058819057"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
